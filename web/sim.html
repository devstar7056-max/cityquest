<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CityQuest Sim</title>
  <script>/*__CONFIG__*/</script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.170.0/",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "3d-tiles-renderer": "https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.4.6/src/index.js",
      "3d-tiles-renderer/plugins": "https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.4.6/src/plugins/index.js"
    }
  }
  </script>
  <style>
    :root { --ink: #f4ede1; --muted: #a9b4c4; --pass: #2ecc71; --fail: #ff4d4d; --fixed: #ffb020; --accent: #4da3ff;
            --panel: rgba(8, 12, 20, 0.78); --mono: ui-monospace, "SF Mono", Menlo, monospace; --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink); font-family: var(--sans); }
    canvas { display: block; }
    .panel { position: fixed; background: var(--panel); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 10px 14px; z-index: 5; }
    #top { top: 14px; left: 14px; display: flex; gap: 14px; align-items: center; }
    #clock { font: 700 26px/1 var(--mono); }
    #mode { font: 800 13px/1 var(--mono); letter-spacing: 1px; color: var(--accent); }
    #quest { top: 14px; right: 14px; width: min(340px, 42vw); }
    #quest h2 { margin: 0 0 4px; font: 800 20px/1.2 var(--sans); }
    #quest .meta { color: var(--muted); font: 500 13px/1.3 var(--sans); }
    #quest .cost { color: var(--pass); font: 700 15px/1.3 var(--mono); margin-top: 6px; }
    #quest ol { margin: 8px 0 0; padding-left: 20px; font: 600 14px/1.5 var(--sans); }
    #log { left: 14px; bottom: 14px; width: min(560px, 60vw); max-height: 32vh; overflow: hidden; font: 12.5px/1.45 var(--mono); }
    #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #log .pass { color: var(--pass); } #log .fail, #log .error { color: var(--fail); } #log .fixed { color: var(--fixed); }
    #controls { right: 14px; bottom: 14px; display: flex; gap: 8px; }
    #controls button { font: 700 14px/1 var(--sans); padding: 10px 12px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
    #attrib { position: fixed; left: 50%; transform: translateX(-50%); bottom: 4px; font: 11px/1.2 var(--sans); color: #fff; text-shadow: 0 0 3px #000; z-index: 6; }
    /* Headset look: two lenses with a dark divider and vignette. */
    /* One gradient per lens: stacked gradients on one element would only leave their overlap visible. */
    #lens { position: fixed; inset: 0; pointer-events: none; z-index: 4; display: none; grid-template-columns: 1fr 1fr; }
    #lens i { background: radial-gradient(ellipse 50% 50% at 50% 50%, transparent 78%, rgba(0,0,0,0.94) 100%); }
    #lens i + i { border-left: 6px solid #000; }
    body.headset #lens { display: grid; }
    body.headset #log, body.headset #quest { opacity: 0.85; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; font: 600 18px/1.4 var(--sans); color: var(--muted); z-index: 3; }
    @media (max-width: 700px) { #quest { width: auto; left: 14px; top: 64px; } #log { width: auto; right: 14px; max-height: 22vh; font-size: 11px; } }
  </style>
</head>
<body>
  <div id="boot">Loading Google Photorealistic 3D Tiles...</div>
  <div id="lens"><i></i><i></i></div>
  <div id="top" class="panel"><div id="clock">--:--:--</div><div id="mode">SIM</div></div>
  <div id="quest" class="panel" hidden><h2 id="q-title"></h2><div class="meta" id="q-meta"></div><div class="cost" id="q-cost"></div><ol id="q-stops"></ol></div>
  <div id="log" class="panel"></div>
  <div id="controls" class="panel"><button id="headset">🥽 Headset</button><button id="cut">🏛️ Breakdown</button><button id="orbit">Orbit</button></div>
  <div id="attrib"></div>
  <script type="module" src="/web/sim.js"></script>
</body>
</html>
